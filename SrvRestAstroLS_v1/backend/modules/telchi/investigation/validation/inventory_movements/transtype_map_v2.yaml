corrections: []
methodology:
  semantic_source: SAP B1 SDK Official Documentation
  appl_obj_source: OINM.ApplObj field (official SAP metadata)
  line_link_strategy_a: 'When ApplObj > 0: AppObjAbs = source DocEntry, AppObjLine
    = source LineNum'
  line_link_strategy_b: 'When ApplObj = -1: BASE_REF → HEADER.DocNum → HEADER.DocEntry
    → LINE.DocEntry + LINE.LineNum = DocLineNum'
  collision_handling: DocNum collision rate tracked per TransType; composite key (TransType
    + BASE_REF) preferred over DocNum alone

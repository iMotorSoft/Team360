# =============================================================================
# Inventory Movements — TransType Map V2 (OFFICIAL, evidence-backed)
# =============================================================================
# Sources of truth (priority order):
#   1. SAP B1 SDK Official Documentation (BoObjectTypes, OINM table spec)
#   2. SAP HANA metadata: ApplObj field (official source object type)
#   3. HANA empirical evidence: table existence, DocNum matching, line link tests
#   4. Legacy code (lowest priority)
#
# Key discovery: OINM.ApplObj field is the OFFICIAL SAP field that identifies
# the source object type. This is more authoritative than DocNum matching.
#
# Confidence levels:
#   CONFIRMED    — official SAP field + line link verified 10/10
#   HIGH         — official SAP object type documented + empirical evidence
#   MEDIUM       — reasonable interpretation, partial evidence
#   UNKNOWN      — preserved raw, semantics pending
#
# Window evidence: 2023-02-01 .. 2023-04-01 (Feb+Mar 2023)
# =============================================================================


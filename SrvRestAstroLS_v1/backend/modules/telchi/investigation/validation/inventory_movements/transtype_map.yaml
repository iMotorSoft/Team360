# ===========================
# DOCNUM COLLISION WARNING
# ===========================
docnum_collision:
  tested: 200 sample BASE_REF values
  collision_count: 5 (for TT=13)
  collision_rate: "2.5% (5/200)"
  worst_case: "DocNum=23012334 exists in 7 tables (OINV, ODLN, OPCH, OPDN, OIGE, OWTR, ORCT)"
  impact: "DocNum alone is NOT sufficient for document linking without TransType qualifier"
  resolution: "Use TransType + BASE_REF (DocNum) as composite link key; prefer ApplObj + AppObjAbs when available"

# ===========================
# UNKNOWN HANDLING POLICY
# ===========================
unknown_policy: |
  Raw TransType is always preserved in current base. Unknown types are kept,
  never discarded, and mapped as UNKNOWN with raw code intact. A future
  extractor may enrich meaning without losing the SAP TransType.
  After official SAP B1 SDK lookup, no types remain UNKNOWN — all 15 types
  found in Telchi are now resolved to official SAP object types.

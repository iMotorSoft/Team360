# =============================================================================
# AGING BUCKETS CONTRACT — TEAM360 TELCHI
# =============================================================================
# Defines the buckets for Accounts Receivable aging analysis.
# Each bucket is defined by min_days and max_days (exclusive).
# days_overdue = AS_OF_DATE - DocDueDate
# =============================================================================
# Last validated: 2026-08-21
# AS_OF_DATE: 2026-08-21
# =============================================================================

buckets:
  - name: NOT_DUE
    min_days: null  # null means no lower bound
    max_days: 0     # exclusive: days_overdue < 0 (future due date)
    description: "Invoice not yet due (DocDueDate > AS_OF_DATE)"
    color: "green"
    validated:
      count: 841
      amount: 2358370.21
      pct_of_total: 61.3

  - name: "1-30"
    min_days: 1     # inclusive: days_overdue >= 1
    max_days: 31    # exclusive: days_overdue < 31
    description: "1 to 30 days past due"
    color: "yellow"
    validated:
      count: 235
      amount: 508352.89
      pct_of_total: 13.2

  - name: "31-60"
    min_days: 31    # inclusive
    max_days: 61    # exclusive
    description: "31 to 60 days past due"
    color: "orange-light"
    validated:
      count: 84
      amount: 117047.87
      pct_of_total: 3.0

  - name: "61-90"
    min_days: 61    # inclusive
    max_days: 91    # exclusive
    description: "61 to 90 days past due"
    color: "orange"
    validated:
      count: 58
      amount: 39994.62
      pct_of_total: 1.0

  - name: "91-120"
    min_days: 91    # inclusive
    max_days: 121   # exclusive
    description: "91 to 120 days past due"
    color: "red-light"
    validated:
      count: 24
      amount: 11797.47
      pct_of_total: 0.3

  - name: "120+"
    min_days: 121   # inclusive
    max_days: null   # null means no upper bound
    description: "More than 120 days past due"
    color: "red"
    validated:
      count: 619
      amount: 811764.37
      pct_of_total: 21.1


# =============================================================================
# SEMANTICS
# =============================================================================
# - days_overdue = AS_OF_DATE - DocDueDate
# - Positive days_overdue = invoice is past due
# - Negative days_overdue = invoice is not yet due
# - AS_OF_DATE is MANDATORY for any aging calculation
# - A historical aging requires reconstructing payment state as of that date
# - Current aging uses current DocStatus and settlement from ITR1
# =============================================================================

